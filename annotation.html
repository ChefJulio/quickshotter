<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickShotter - Annotate</title>
  <script type="module" src="/src/annotation.ts" defer></script>
</head>
<body>
  <canvas id="annotation-canvas"></canvas>

  <div id="annotation-toolbar">
    <span class="drag-handle">:::</span>

    <button class="tool-btn active" id="tool-freehand" title="Freehand (default drag)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round">
        <path d="M3 17 Q8 5 12 14 Q16 23 21 8"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-arrow" title="Arrow (Shift+drag)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="20" x2="18" y2="6"/>
        <polyline points="10,4 20,4 20,14" fill="#c8c8c8" stroke="#c8c8c8" stroke-width="1.5"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-oval" title="Oval (Ctrl+drag)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2">
        <ellipse cx="12" cy="12" rx="9" ry="7"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-rect" title="Rectangle (Alt+drag)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2">
        <rect x="3" y="5" width="18" height="14" rx="1"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-text" title="Text (Alt+click)">
      <svg viewBox="0 0 24 24" fill="#c8c8c8">
        <text x="12" y="18" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">A</text>
      </svg>
    </button>
    <button class="tool-btn" id="tool-crop" title="Crop">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round">
        <path d="M6 2v4H2M6 6h12v12h4M18 22v-4h4M18 18H6V6"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-blur" title="Blur region">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="8" cy="10" r="1" fill="#c8c8c8" opacity="0.4"/>
        <circle cx="12" cy="9" r="1.5" fill="#c8c8c8" opacity="0.3"/>
        <circle cx="16" cy="11" r="1" fill="#c8c8c8" opacity="0.4"/>
        <circle cx="10" cy="14" r="1.2" fill="#c8c8c8" opacity="0.35"/>
        <circle cx="15" cy="15" r="1" fill="#c8c8c8" opacity="0.3"/>
      </svg>
    </button>
    <button class="tool-btn" id="tool-step" title="Step numbering (click to place)">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="#c8c8c8"/>
        <text x="12" y="16" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#1e1e1e">1</text>
      </svg>
    </button>
    <button class="tool-btn" id="tool-grabtext" title="Grab text (OCR)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 2"/>
        <text x="12" y="15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#c8c8c8" stroke="none">T</text>
      </svg>
    </button>

    <span class="separator">|</span>

    <select id="arrow-style">
      <option value="standard">Filled</option>
      <option value="open">Hollow</option>
      <option value="double">Double</option>
    </select>

    <span class="separator">|</span>

    <input type="color" id="color-picker" value="#ff0000" title="Annotation color" />

    <span class="spinner-label">W:</span>
    <input type="number" id="stroke-width" min="1" max="20" value="3" class="spinner" />

    <span class="spinner-label">Pt:</span>
    <input type="number" id="font-size" min="8" max="72" value="16" class="spinner" />

    <span class="separator">|</span>

    <button id="btn-undo" class="action-btn undo-redo" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="btn-redo" class="action-btn undo-redo" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>

    <span class="separator">|</span>

    <button id="btn-save" class="action-btn save" title="Save (Enter)">Save</button>
    <button id="btn-cancel" class="action-btn cancel" title="Cancel (Escape)">Cancel</button>
  </div>

  <div id="crop-bar">
    <span>Drag to select crop area, then apply</span>
    <button id="crop-apply" class="action-btn save">Apply</button>
    <button id="crop-cancel" class="action-btn cancel">Cancel</button>
  </div>

  <div id="text-input-container" style="display: none;">
    <input type="text" id="text-input" placeholder="Type text..." />
  </div>
</body>
</html>
