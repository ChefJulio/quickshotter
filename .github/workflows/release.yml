name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build overlay daemon
        run: cargo build --release --manifest-path overlay/Cargo.toml ${{ matrix.args }}

      - name: Copy overlay binary (macOS)
        if: matrix.platform == 'macos-latest'
        run: cp overlay/target/aarch64-apple-darwin/release/quickshotter-overlay src-tauri/target/aarch64-apple-darwin/release/ 2>/dev/null || true

      - name: Copy overlay binary (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p src-tauri/target/release/
          cp overlay/target/release/quickshotter-overlay.exe src-tauri/target/release/ 2>/dev/null || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickShotter ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            | Platform | File |
            |----------|------|
            | **Windows** (64-bit) | `_x64-setup.exe` |
            | **macOS** (Apple Silicon) | `_aarch64.dmg` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update-release-body:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update release with download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          gh release edit "$TAG" --repo "$REPO" --notes "$(cat <<EOF
          ## Download

          | Platform | Installer |
          |----------|-----------|
          | **Windows** (64-bit) | [QuickShotter_${VERSION}_x64-setup.exe](${BASE}/QuickShotter_${VERSION}_x64-setup.exe) |
          | **macOS** (Apple Silicon) | [QuickShotter_${VERSION}_aarch64.dmg](${BASE}/QuickShotter_${VERSION}_aarch64.dmg) |

          ### macOS: first launch

          The app is not notarized yet, so macOS will block it on first open. To fix this:
          1. Open the .dmg and drag QuickShotter to Applications
          2. **Right-click** the app and select **Open** (don't double-click)
          3. Click **Open** in the dialog that appears

          If that doesn't work: System Settings > Privacy & Security > scroll down and click **Open Anyway**.

          ---

          Other files (\`.sig\`, \`.tar.gz\`, \`latest.json\`) are used by the built-in auto-updater.
          EOF
          )"
