[package]
name = "quickshotter"
version = "1.4.4"
description = "Fast cross-platform screenshot tool"
authors = ["you"]
edition = "2021"

[lib]
name = "quickshotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.8"
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = "0.4"
dirs = "6"
base64 = "0.22"
thiserror = "2"
mouse_position = "0.1"
crossbeam-channel = "0.5"
gif = "0.13"
color_quant = "1.1"
openh264 = "0.6"


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Graphics_Imaging",
  "Media_Ocr",
  "Globalization",
  "Foundation",
  "Storage_Streams",
] }

# Optimize dependencies even in debug builds -- critical for image processing
[profile.dev.package."*"]
opt-level = 2
