<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown</title>
    <script type="module" src="/src/countdown.ts" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      .countdown {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        background: rgba(20, 20, 20, 0.88);
        border: 2px solid rgba(0, 170, 255, 0.6);
        border-radius: 50%;
        font-family: 'Consolas', 'SF Mono', monospace;
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        letter-spacing: -1px;
      }
    </style>
  </head>
  <body>
    <div class="countdown" id="timer"></div>
  </body>
</html>
